name: Compiler le COBOL et publier le site

# Le COBOL tourne à la construction, pas au service : l'hébergeur ne reçoit que
# des fichiers statiques et n'a jamais besoin d'un compilateur. Ce workflow
# installe GnuCOBOL sur un runner neuf, compile, lance les tests, génère la
# page, puis publie — ce qui vérifie au passage que le projet se reconstruit
# depuis zéro sur une machine qui ne connaît rien de mon poste.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer GnuCOBOL
        run: sudo apt-get update && sudo apt-get install -y gnucobol

      - name: Version du compilateur
        run: cobc --version | head -2

      - name: Compiler, tester, générer
        run: ./build.sh

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
